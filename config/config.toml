[engine.ollama]
base_url = "http://localhost:11434"
default_model = "qwen3.5:9b"
embedding_model = "nomic-embed-text"
fallback_model = "qwen3.5:9b"

[engine.ollama.models]
reasoning = "qwen3.5:9b"
coding = "qwen3.5:9b"
embedding = "nomic-embed-text"

[speech]
whisper_model = "small.en"
whisper_compute_type = "int8"       # Use "float16" on GPU machines
tts_voice = "af_heart"
tts_speed = 1.07                     # 1.0–1.1× for calm, non-urgent tone
tts_silence_sec = 0.18              # Silence gap between sentences (seconds)

[memory]
qdrant_url = "http://localhost:6333"
collection_name = "adhd_memory"
embedding_dim = 768                   # nomic-embed-text dimension

[scheduler]
transition_buffer_minutes = 15
time_scaling_alpha_min = 1.4
time_scaling_alpha_max = 1.8
max_sprint_minutes = 25

[body_double]
drift_threshold_minutes = 10
nudge_cooldown_minutes = 15

[obsidian]
enabled = true
base_url = "http://localhost:27124"
vault_path = "vault"
api_token = ""                    # Set if you enabled auth in the Local REST API plugin

[guardrails]
no_red_badges = true
no_overdue_counters = true
no_modal_dialogs = true
voice_pacing_min = 1.0
voice_pacing_max = 1.1
supportive_phrasing = true
