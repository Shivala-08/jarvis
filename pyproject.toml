[project]
name = "adhd-copilot"
version = "0.2.0"
description = "ADHD Cognitive Co-Processor — Local-first personal AI with OpenJarvis-inspired architecture"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "mem0ai>=0.1.0",
    "qdrant-client>=1.12.0",
    "faster-whisper>=1.0.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12.0",
    "sounddevice>=0.5.0",
    "psutil>=5.9.0",
    "toml>=0.10.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    # Phase 8: Coding assistant
    "aider-chat>=0.70.0",
    # Phase 9: Web-task agent (replaces browser-use)
    "scrapling>=0.3.0",
    "pywebview>=6.2.1",
    "websockets>=11.0.3",
    "mss>=10.2.0",
    "pillow>=12.1.1",
    "mlx-vlm>=0.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "memory", "speech", "core", "remote"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
