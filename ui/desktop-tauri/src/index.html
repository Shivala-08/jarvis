<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHD Co-Processor</title>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #8b949e;
    }
    .loader {
      text-align: center;
      max-width: 400px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #21262d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f85149; display: none; margin-top: 16px; }
    .retry-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .retry-btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Connecting to ADHD Co-Processor…</p>
    <div class="error" id="error-msg">
      <p>⚠️ Backend server not found at localhost:8080</p>
      <p style="font-size:13px;">Start the server first:</p>
      <code style="font-size:12px; color:#58a6ff;">cd jarvis-ai-assistant && uv run python main.py --ui</code>
    </div>
    <button class="retry-btn" id="retry-btn" style="display:none;" onclick="retry()">Retry</button>
  </div>
  <script>
    const DASHBOARD_URL = 'http://localhost:8080/';
    let attempts = 0;
    const MAX_ATTEMPTS = 15;

    async function checkBackend() {
      attempts++;
      try {
        const res = await fetch('http://localhost:8080/api/health', { method: 'GET' });
        if (res.ok) {
          document.getElementById('status-text').textContent = 'Connected! Loading…';
          setTimeout(() => { window.location.href = DASHBOARD_URL; }, 300);
          return;
        }
      } catch (e) {}

      if (attempts >= MAX_ATTEMPTS) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('retry-btn').style.display = 'inline-block';
        return;
      }
      setTimeout(checkBackend, 1000);
    }

    function retry() {
      attempts = 0;
      document.getElementById('spinner').style.display = '';
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('retry-btn').style.display = 'none';
      document.getElementById('status-text').textContent = 'Connecting to ADHD Co-Processor…';
      checkBackend();
    }

    checkBackend();
  </script>
</body>
</html>
